<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="light dark">
<title>Позвонить сейчас</title>
<style>
/* 2026-10-09 20:2x: = the site / Mini App form: farpost palette (day #f5f8fa / #1564d4, night #141518 / #79b0ff),
   outlined buttons = site bottom buttons: white + 2px #2c7dd2 (farpost .blueButton border) + #1e1d20; night #1c1e22 / #3283d1 / #f3f4f6 */
:root{--bg:#f5f8fa;--text:#1e1d20;--hint:#666;--title:#1564d4;--ob-bg:#fff;--ob-line:#2c7dd2;--ob-text:#1e1d20}
@media (prefers-color-scheme:dark){:root{--bg:#141518;--text:#f3f4f6;--hint:#a4a9b1;--title:#79b0ff;--ob-bg:#1c1e22;--ob-line:#3283d1;--ob-text:#f3f4f6}}
html,body{margin:0;min-height:100%;font:18px/1.3 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  background:var(--bg);color:var(--text)}
main{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:24px 18px calc(24px + env(safe-area-inset-bottom));box-sizing:border-box;gap:12px}
h1{margin:0 0 8px;font-size:20px;font-weight:700;text-align:center;color:var(--title)}
.sub{margin:0 0 12px;font-size:14px;color:var(--hint);text-align:center}
a.num{display:block;width:100%;max-width:420px;padding:20px 16px;border-radius:14px;background:var(--ob-bg);color:var(--ob-text);box-shadow:inset 0 0 0 2px var(--ob-line);
  font-size:22px;font-weight:700;text-decoration:none;text-align:center;box-sizing:border-box}
a.num:active{opacity:.85}
</style>
</head>
<body>
<main>
  <h1>📞 Позвонить сейчас</h1>
  <p class="sub">Выберите номер — звонок в один тап</p>
  <a class="num" id="n1" href="tel:+821048698751">📞 Ансан · 010-4869-8751</a>
  <a class="num" id="n2" href="tel:+821074021404">📞 Инчон · 010-7402-1404</a>
</main>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script>
(function(){
  "use strict";
  var CALL_PAGE = "https://pereezdkorea-ops.github.io/movebot-form/call.html";
  // [unused local digits, E.164 for tel: and call.html#, label]
  var NUMS = [["01048698751","+821048698751","Ансан · 010-4869-8751"],["01074021404","+821074021404","Инчон · 010-7402-1404"]];
  var tg = window.Telegram && window.Telegram.WebApp;
  if (tg) { try { tg.ready(); tg.expand(); } catch (e) {} }
  function wire(a, raw, e164, shown) {
    a.textContent = "📞 " + shown;
    a.setAttribute("aria-label", "Позвонить " + shown);
    a.href = "tel:" + e164;
    a.addEventListener("click", function(ev){
      // Mini App: tel: blocked → open call.html outside (same as v2/v7 «Позвонить»)
      if (tg && tg.openLink) {
        ev.preventDefault();
        tg.openLink(CALL_PAGE + "#" + encodeURIComponent(e164), {try_instant_view: false});
      }
    });
  }
  wire(document.getElementById("n1"), NUMS[0][0], NUMS[0][1], NUMS[0][2]);
  wire(document.getElementById("n2"), NUMS[1][0], NUMS[1][1], NUMS[1][2]);
})();
</script>
</body>
</html>

<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#f5f8fa">
<meta name="robots" content="noindex">
<title>Заявка на переезд</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script>
// day/night before the first paint: saved choice > Telegram (colorScheme / themeParams) > the system (prefers-color-scheme)
(function(){
  var KEY = "v2theme", root = document.documentElement, tg = window.Telegram && window.Telegram.WebApp;
  var inTg = !!(tg && (tg.initData || (tg.platform && tg.platform !== "unknown")));
  function saved(){try{var v = localStorage.getItem(KEY); return v === "dark" || v === "light" ? v : null}catch(e){return null}}
  function lum(hex){var m = /^#?([0-9a-f]{6})$/i.exec(hex || ""); if(!m) return null; var n = parseInt(m[1], 16);
    return (0.2126 * (n >> 16) + 0.7152 * (n >> 8 & 255) + 0.0722 * (n & 255)) / 255}
  function system(){
    if(inTg){
      if(tg.colorScheme === "dark" || tg.colorScheme === "light") return tg.colorScheme;
      var l = lum(tg.themeParams && tg.themeParams.bg_color); if(l !== null) return l < 0.5 ? "dark" : "light";
    }
    try{return window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light"}catch(e){return "light"}
  }
  var BG = {light:"#f5f8fa", dark:"#141518"};
  function apply(t){
    root.setAttribute("data-theme", t);
    var m = document.querySelector('meta[name="theme-color"]'); if(m) m.setAttribute("content", BG[t]);
    if(inTg){try{tg.setHeaderColor(BG[t]); tg.setBackgroundColor(BG[t]); tg.setBottomBarColor && tg.setBottomBarColor(BG[t])}catch(e){}}
    var b = document.getElementById("theme"); if(b){b.textContent = t === "dark" ? "☀️" : "🌙";
      b.setAttribute("aria-label", t === "dark" ? "Светлая тема" : "Тёмная тема"); b.title = b.getAttribute("aria-label")}
  }
  function follow(){if(!saved()) apply(system())}       // no own choice yet -> follow Telegram / the system live
  window.__theme = {
    get: function(){return root.getAttribute("data-theme")},
    toggle: function(){var t = window.__theme.get() === "dark" ? "light" : "dark"; try{localStorage.setItem(KEY, t)}catch(e){} apply(t); return t},
    apply: apply, follow: follow, system: system, saved: saved, BG: BG
  };
  apply(saved() || system());
  try{var mq = matchMedia("(prefers-color-scheme: dark)"); mq.addEventListener ? mq.addEventListener("change", follow) : mq.addListener(follow)}catch(e){}
  if(inTg && tg.onEvent) tg.onEvent("themeChanged", follow);
})();
</script>
<style>
/* v8 = DRAFT 2026-10-09: same as the bot — [Отправить заявку | 📞 Позвонить сейчас], 📞 Ансан / 📞 Инчхон, one farpost blue (v5 palette: #1564d4 day / #79b0ff night), no green.
   v6 = DRAFT: the live form (v5 colours) on ONE scrolling page with a pinned bottom bar [Позвонить | Отправить заявку].
   v5 = live v2 with ONLY the colours changed to the farpost / «Календарь» palette: blue headings, links and selected states,
   grey #666 captions, #1e1d20 values, orange #c24a00 accent; night: graphite #141518 with #79b0ff blue; the handset stays green */
:root{--bg:#f5f8fa;--card:#fff;--text:#1e1d20;--hint:#666;--line:#e4e7ea;--chip:#eef3f8;--on:#1564d4;--on-text:#fff;--err:#c0281e;--link:#1564d4;--btn:#1564d4;--btn-text:#fff;--ob-bg:#fff;--ob-line:#2c7dd2;--ob-text:#1e1d20;
  --field:#fff;--dis:#c6c6c6;--bg0:rgba(245,248,250,0);--title:#1564d4;--accent:#c24a00;color-scheme:light}
/* night: graphite background and cards, blue #79b0ff headings / active chip / main button (dark text on it); hints ≥ 4.5:1 on the cards */
:root[data-theme="dark"]{--bg:#141518;--card:#1c1e22;--text:#f3f4f6;--hint:#a4a9b1;--line:#30333a;--chip:#25282d;--on:#79b0ff;--on-text:#141518;
  --err:#ff8a80;--link:#79b0ff;--btn:#79b0ff;--btn-text:#141518;--ob-bg:#1c1e22;--ob-line:#3283d1;--ob-text:#f3f4f6;--field:#17191c;--dis:#5a5f68;--bg0:rgba(20,21,24,0);--title:#79b0ff;--accent:#ff7a29;color-scheme:dark}
h1,h2{color:var(--title)}
h2 small{color:var(--hint)}
.back{color:var(--link)}
.theme{position:absolute;top:12px;right:10px;z-index:5;width:34px;height:34px;padding:0;border:0;border-radius:17px;background:var(--card);
  font-size:17px;line-height:34px;text-align:center;cursor:pointer;touch-action:manipulation;box-shadow:0 0 0 1px var(--line)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);
  font:16px/1.3 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
main{position:relative;max-width:560px;margin:0 auto;padding:8px 12px 0}
.hide{display:none!important}
.badge{display:block;width:max-content;margin:8px auto 0;padding:3px 10px;border-radius:10px;background:var(--accent);color:#fff;
  font-size:11px;font-weight:800;letter-spacing:.08em}
.top{padding:6px 2px 10px}
.top .row{display:flex;align-items:center;min-height:32px;padding-right:42px}   /* room for the ☀️/🌙 button */
.back{border:0;background:none;color:var(--text);font:inherit;font-size:16px;font-weight:600;padding:6px 10px 6px 0;margin-right:auto;cursor:pointer}
.step{margin-left:auto;font-size:13px;color:var(--hint)}
h1{margin:2px 0 0;font-size:24px;font-weight:700;letter-spacing:-.01em}
section{background:var(--card);border-radius:16px;padding:14px;margin-bottom:10px;border:1.5px solid transparent}
section.err{border-color:var(--err)}
h2{margin:0 0 10px;font-size:15px;font-weight:600}
.sub{margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}
.sub h3{margin:0 0 8px;font-size:15px;font-weight:600}
h2 small,h3 small{font-weight:400;font-size:13px;color:var(--hint);margin-left:6px}
.lbl{font-size:13px;color:var(--hint);margin:0 0 6px 2px}
.mt{margin-top:12px}
select,input[type=tel],input[type=text]#other{width:100%;min-height:48px;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--field);
  color:var(--text);font:inherit;outline:none;appearance:none;-webkit-appearance:none}
select{background-image:linear-gradient(45deg,transparent 50%,var(--hint) 50%),linear-gradient(135deg,var(--hint) 50%,transparent 50%);
  background-position:calc(100% - 17px) 50%,calc(100% - 12px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-right:30px}
select.empty{color:var(--hint)}
select:focus,input:focus{border-color:var(--on)}
input::placeholder{color:var(--hint)}
.chips{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.chip{position:relative;display:flex;align-items:center;justify-content:center;min-width:0;min-height:44px;padding:0 8px;border:0;
  border-radius:22px;background:var(--chip);color:var(--text);font:inherit;font-size:15px;cursor:pointer;touch-action:manipulation;
  -webkit-user-select:none;user-select:none}
.chip.on{background:var(--on);color:var(--on-text)}
.chip .t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip input[type=date]{position:absolute;inset:0;width:100%;height:100%;margin:0;padding:0;border:0;opacity:0;cursor:pointer;font-size:16px}
.whint{margin:8px 0 0 2px;min-height:16px;font-size:12px;line-height:16px;color:var(--hint)}
.fl{display:flex;gap:8px;align-items:center;margin-top:8px}
/* DRAFT addr: optional address line + «📷 Адрес по фото» under the city */
.addr{display:flex;flex-wrap:wrap;gap:8px;align-items:stretch;margin-top:8px}   /* full-width address, the helper button under it */
.addr input{flex:1 1 100%;min-width:0;min-height:48px;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--field);
  color:var(--text);font:inherit;font-size:15px;outline:none}
.addr input:focus{border-color:var(--on)}
.addrbtn{flex:1 1 100%;min-height:46px;padding:0 10px;border:0;border-radius:12px;background:var(--ob-bg);color:var(--ob-text);font:inherit;
  font-size:14px;font-weight:600;white-space:nowrap;cursor:pointer;touch-action:manipulation;box-shadow:inset 0 0 0 2px var(--ob-line)}
.addrbtn:disabled{opacity:.6}
.addr .opts{flex:1 1 100%;display:flex;gap:8px}   /* cam: «📷 Адрес по фото» -> «📷 Снять» | «🖼 Из галереи» */
.addr .opts.hide{display:none}
.addr .opts .addrbtn{flex:1 1 calc(50% - 4px)}
.addrbtn[aria-expanded="true"]{background:var(--ob-line);color:#fff}
/* cam: in-page camera (Telegram Android ignores capture= and opens only the gallery) */
#cam{position:fixed;inset:0;z-index:1000;background:#000;display:flex;flex-direction:column}
#cam.hide{display:none}
#cam video{flex:1 1 auto;min-height:0;width:100%;object-fit:cover;background:#000}
#cam .frame{position:absolute;left:6%;right:6%;top:32%;height:22%;border:2px solid rgba(255,255,255,.85);border-radius:14px;
  box-shadow:0 0 0 100vmax rgba(0,0,0,.35);pointer-events:none}
#cam .ctip{position:absolute;left:0;right:0;top:calc(32% - 40px);text-align:center;color:#fff;font-size:15px;font-weight:600;text-shadow:0 1px 3px #000}
#cam .cbar{flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;padding:18px 28px calc(18px + env(safe-area-inset-bottom));background:#000}
#cam .cbtn{min-width:96px;min-height:44px;border:0;border-radius:12px;background:#2a2b30;color:#fff;font:inherit;font-size:15px;font-weight:600}
#cam .shut{width:72px;height:72px;border-radius:50%;border:4px solid #fff;background:#fff;box-shadow:inset 0 0 0 4px #000}
#cam .shut:active{background:#ddd}
.ahint{margin:6px 0 0 2px;font-size:12px;line-height:16px;color:var(--hint);min-height:0}
.ahint:empty{display:none}
.fl select{flex:0 0 112px;width:112px}
/* «Когда» row 2: optional part of the day (Утром / Днём / Вечером) OR an exact hour (Время…), never both; the chosen day sits in
   the heading, so the block is no taller than before and screen 1 still fits a 390×844 phone */
.fl.tm{gap:6px}
.parts{display:flex;flex:1;min-width:0;gap:6px}
.parts .chip{flex:1 1 0;min-width:max-content;padding:0 7px}
.fl.tm select{flex:0 0 104px;width:104px;padding-left:10px;padding-right:24px;background-position:calc(100% - 15px) 50%,calc(100% - 10px) 50%}
@media (max-width:374px){.parts .chip{font-size:14px;padding:0 6px}}
.seg{display:flex;flex:1;min-width:0;background:var(--chip);border-radius:12px;padding:3px;min-height:48px}
.seg button{flex:1;min-width:0;border:0;border-radius:9px;background:transparent;color:var(--text);font:inherit;font-size:15px;
  min-height:42px;padding:0 4px;white-space:nowrap;cursor:pointer;touch-action:manipulation}
.seg button.on{background:var(--on);color:var(--on-text)}
.cnt{display:flex;align-items:center;justify-content:space-between;min-height:52px}
.cnt+.cnt{border-top:1px solid var(--line)}
.cnt .ctl{display:flex;align-items:center;gap:6px}
.cnt button{width:40px;height:40px;border:0;border-radius:20px;background:var(--chip);color:var(--text);font:inherit;font-size:22px;
  line-height:1;cursor:pointer;touch-action:manipulation;-webkit-user-select:none;user-select:none}
.cnt button:disabled{color:var(--dis);cursor:default}
.cnt .n{width:30px;text-align:center;font-size:17px;font-weight:600;font-variant-numeric:tabular-nums}
.cnt .n.zero{color:var(--hint);font-weight:400}
/* «Что везём»: eight compact tiles, 4 per row (name over − n +), using the full card width */
#items{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:5px;margin:0 -4px}
#items .cnt{flex-direction:column;justify-content:center;gap:5px;min-width:0;min-height:0;padding:8px 1px 6px;border-radius:12px;background:var(--chip)}
#items .cnt+.cnt{border-top:0}
#other{margin-top:8px}
#items .name{max-width:100%;font-size:13px;letter-spacing:-.01em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#items .ctl{gap:1px}
#items .cnt button{width:30px;height:30px;border-radius:15px;background:var(--card);font-size:19px}
#items .cnt .n{width:16px;font-size:16px}
@media (max-width:379px){#items .cnt button{width:27px;height:27px}#items .cnt .n{width:15px}#items .name{font-size:12px;letter-spacing:-.02em}}
/* a bit tighter so screen 1 (both cities + sadari + when) and its bottom bar fit a 390×844 phone; the empty error line takes no room */
section{padding:12px 12px 13px;margin-bottom:8px}
h2{margin-bottom:8px}
.top{padding:4px 2px 8px}
.msg:empty{min-height:0;margin:0}
.badge{position:absolute;top:18px;left:50%;transform:translateX(-50%);margin:0;z-index:4}   /* in the free middle of the top row */
/* calls */
/* v6: one page; the bar is pinned to the bottom of the screen (thumb zone, above the home indicator) and never scrolls away:
   [Позвонить | Отправить заявку] in one row. A tap on «Позвонить» shows our two numbers above the row, a second tap hides them.
   Browser: tel:, Telegram: openLink -> call.html. (v8: no green handset; labels start with 📞) */
.callbox{display:flex;gap:8px;margin:0}
.callbox .callbtn{flex:1 1 0;width:auto;min-height:54px;border-radius:14px;font-size:16px}
.callbox .main{flex:1 1 0;min-width:0}
.callbtn,.nums a{display:flex;align-items:center;justify-content:center;width:100%;min-width:0;min-height:42px;padding:0 6px;border:0;
  border-radius:12px;background:var(--ob-bg);color:var(--ob-text);font:inherit;font-size:15px;font-weight:600;text-decoration:none;
  white-space:nowrap;overflow:hidden;cursor:pointer;touch-action:manipulation}
.nums{display:grid;grid-template-columns:minmax(0,1fr);gap:8px;margin:0 0 8px}
.nums a{min-height:50px;font-size:17px;border-radius:14px}
.nums a{font-variant-numeric:tabular-nums}
.callbtn,.nums a,.bar .main{box-shadow:inset 0 0 0 2px var(--ob-line)}
.callbtn:active,.nums a:active{opacity:.6}
@media (max-width:359px){.callbox .callbtn{font-size:14px;padding:0 3px}}
/* /calls */
.auto{margin:6px 0 0 2px;font-size:13px;color:var(--text);font-weight:600}
#phone_tg{width:100%;min-height:46px;margin-top:8px;border:0;border-radius:12px;background:var(--btn);color:var(--btn-text);font:inherit;
  font-size:15px;font-weight:600;cursor:pointer}
.grey{margin:10px 2px 0;font-size:13px;color:var(--hint)}
.msg{color:var(--err);text-align:center;font-size:14px;min-height:18px;margin:2px 0 6px}
.bar{position:fixed;left:0;right:0;bottom:0;z-index:6;padding:12px 12px calc(10px + env(safe-area-inset-bottom));
  padding-left:max(12px, env(safe-area-inset-left));padding-right:max(12px, env(safe-area-inset-right));
  background:linear-gradient(var(--bg0),var(--bg) 12px)}
.bar>*{max-width:536px;margin-left:auto;margin-right:auto}
/* nothing hides behind the pinned bar: the page ends --barh (the bar's real height, kept up to date by the script) lower,
   and scrolling to a field (validation, focus) keeps it above the bar */
:root{--barh:84px}
html{scroll-padding-bottom:calc(var(--barh) + 8px)}
#scr1{padding-bottom:calc(var(--barh) + 8px)}
.main{display:block;width:100%;min-height:54px;border:0;border-radius:14px;background:var(--ob-bg);color:var(--ob-text);font:inherit;
  font-size:17px;font-weight:600;cursor:pointer;touch-action:manipulation}
.card{margin:0;white-space:pre-wrap;word-break:break-word;font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
.hp{position:absolute;left:-10000px;top:auto;width:1px;height:1px;overflow:hidden}
.done{text-align:center;padding:56px 12px 24px}.done .ok{font-size:46px;line-height:1}.done h1{margin:14px 0 8px;font-size:22px}
.main:disabled{opacity:.6}
.bubble{display:inline-block;margin:0;padding:9px 12px;border-radius:16px 16px 16px 4px;background:var(--chip);font-size:15px}
</style>
</head>
<body>
<div id="badge" class="badge hide">ПРЕВЬЮ</div>
<main>
 <button type="button" class="theme" id="theme" aria-label="Тёмная тема">🌙</button>
 <div id="scr1">
  <div class="top"><div class="row"></div></div>
  <section id="b-from">
    <h2>Откуда</h2>
    <select id="from_city" class="empty" aria-label="Откуда"></select>
    <div class="addr"><input type="text" id="from_addr" maxlength="200" autocomplete="street-address" enterkeyhint="next"
      placeholder="Адрес (необязательно)" aria-label="Адрес откуда"><button type="button" class="addrbtn" id="ocr_btn_from" aria-expanded="false" aria-controls="ocr_opts_from">📷 Адрес по фото</button><div class="opts hide" id="ocr_opts_from"><button type="button" class="addrbtn" id="ocr_cam_from" aria-label="Снять адрес откуда камерой">📷 Снять</button><button type="button" class="addrbtn" id="ocr_gal_from" aria-label="Фото адреса откуда из галереи">🖼 Из галереи</button></div></div>
    <p class="ahint" id="from_hint" aria-live="polite"></p>
    <div class="fl" data-side="from"></div>
  </section>
  <section id="b-to">
    <h2>Куда</h2>
    <select id="to_city" class="empty" aria-label="Куда"></select>
    <div class="addr"><input type="text" id="to_addr" maxlength="200" autocomplete="off" enterkeyhint="next"
      placeholder="Адрес (необязательно)" aria-label="Адрес куда"><button type="button" class="addrbtn" id="ocr_btn_to" aria-expanded="false" aria-controls="ocr_opts_to">📷 Адрес по фото</button><div class="opts hide" id="ocr_opts_to"><button type="button" class="addrbtn" id="ocr_cam_to" aria-label="Снять адрес куда камерой">📷 Снять</button><button type="button" class="addrbtn" id="ocr_gal_to" aria-label="Фото адреса куда из галереи">🖼 Из галереи</button></div></div>
    <p class="ahint" id="to_hint" aria-live="polite"></p>
    <div class="fl" data-side="to"></div>
  </section>
  <section id="b-ladder">
    <h2>Садарича<small>подъёмник через окно</small></h2>
    <div class="seg" id="ladder" role="group" aria-label="Садарича"></div>
    <p class="auto hide" id="ladder_auto" aria-live="polite"></p>
  </section>
  <section id="b-when">
    <h2>Когда<small id="when_hint" aria-live="polite"></small></h2>
    <div class="chips" id="when" role="group" aria-label="Когда"></div>
    <div class="fl tm">
      <div class="parts" id="part" role="group" aria-label="Время дня (необязательно)"></div>
      <select id="time" class="empty" aria-label="Время (необязательно)"></select>
    </div>
  </section>
  <section id="b-items">
    <h2>Что везём</h2>
    <div id="items"></div>
    <input type="text" id="other" maxlength="200" autocomplete="off" enterkeyhint="done"
           placeholder="Например: коробки, стол, комод, разборка шкафа" aria-label="Другое: чего нет в списке">
  </section>
  <section id="b-movers">
    <h2>Нужны грузчики?</h2>
    <div id="movers_box"></div>
  </section>
  <section id="b-phone">
    <h2>Телефон</h2>
    <input type="tel" id="phone" inputmode="tel" autocomplete="tel" maxlength="20" placeholder="010-1234-5678" aria-label="Телефон">
    <button type="button" id="phone_tg">Поделиться номером</button>
    <p class="grey hide" id="phone_note">Введите номер вручную</p>
    <p class="grey" id="photo_note">Фото можно прислать в чат после отправки.</p>
    <div class="hp" aria-hidden="true"><label for="hp">Не заполняйте это поле</label>
      <input type="text" id="hp" name="website" tabindex="-1" autocomplete="off"></div>
  </section>
  <input type="file" id="ocr_file_cam" accept="image/*" capture="environment" class="hide">
  <input type="file" id="ocr_file_gal" accept="image/*" class="hide">
  <div id="cam" class="hide" role="dialog" aria-label="Камера"><video id="cam_v" playsinline muted autoplay></video>
    <div class="frame"></div><div class="ctip">Наведите на адрес</div>
    <div class="cbar"><button type="button" class="cbtn" id="cam_x">Отмена</button><button type="button" class="shut" id="cam_shot" aria-label="Снять"></button><span style="min-width:96px"></span></div></div>
  <div class="bar" id="bar"><p class="msg" id="msg" aria-live="polite"></p><div class="callbox" data-calls><button type="button" class="main" id="send">Отправить заявку</button></div></div>
 </div>
 <div id="scr3" class="hide">
  <div class="top"><div class="row"><button type="button" class="back" id="back3">‹ Назад</button></div><h1 id="pv_title"></h1></div>
  <section>
    <h2 id="pv_card"></h2>
    <pre class="card" id="card"></pre>
  </section>
  <section>
    <h2 id="pv_client"></h2>
    <p class="bubble" id="client_msg"></p>
  </section>
  <p class="grey" id="pv_note" style="text-align:center;margin-bottom:24px"></p>
 </div>
 <div id="scr4" class="hide">
  <div class="done"><div class="ok">✅</div><h1 id="done_msg">Приняли. Перезвоним в ближайшее время.</h1></div>
